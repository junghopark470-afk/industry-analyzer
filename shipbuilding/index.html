<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선업 산업 리포트 · 산업동향 분석기</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 항해일지형 단일 칼럼. 상단 논지·사이클 → 중단 구조·매력도(PE) → 하단 가격·재무·딜(IB). 섹션 번호는 읽는 순서. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#13202B; --muted:#5A6874; --line:#D9DFE4;
  --hull:#B23A2E; --sea:#1D6A74; --sea-soft:#E1EEF0; --hull-soft:#F6E5E2;
  --good:#2F7D4A; --warn:#A86A12; --bad:#B23A2E;
  --grid:#E6EAED; --axis:#B9C3CB; --track:#E3E8EC; --on-fill:#FFFFFF; --c-hd:#008F86; --c-hw:#C0661A; --c-sh:#4258B0;
  --f-display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171E; --surface:#16212A; --ink:#E4EAEE; --muted:#93A2AE; --line:#2A3843;
  --hull:#E0675A; --sea:#5DB3BE; --sea-soft:#17323A; --hull-soft:#3A201D;
  --good:#6CC48A; --warn:#E0A54A; --bad:#E0675A; --grid:#22303A; --axis:#3A4B57; --track:#22303A; --on-fill:#0F171E; --c-hd:#14A99D; --c-hw:#D07A2C; --c-sh:#6E7FD6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171E; --surface:#16212A; --ink:#E4EAEE; --muted:#93A2AE; --line:#2A3843;
  --hull:#E0675A; --sea:#5DB3BE; --sea-soft:#17323A; --hull-soft:#3A201D;
  --good:#6CC48A; --warn:#E0A54A; --bad:#E0675A; --grid:#22303A; --axis:#3A4B57; --track:#22303A; --on-fill:#0F171E; --c-hd:#14A99D; --c-hw:#D07A2C; --c-sh:#6E7FD6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:20px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.78rem;letter-spacing:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:disabled{color:var(--muted);cursor:not-allowed}
.tab:disabled::after{content:" · 준비 중";font-size:.75rem}

/* hero */
.hero{padding-block:36px 20px;display:grid;gap:20px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hull);font-weight:600}
.hero h1{font-size:clamp(1.8rem,4.6vw,2.8rem)}
.hero .lede{max-width:68ch;color:var(--muted);font-size:1.02rem}
.asof{font-size:.8rem;color:var(--muted)}

/* nav */
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;padding-block:10px;border-block:1px solid var(--line);margin-bottom:8px}
.toc a{color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--ink)}
.band{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-block:32px 4px;display:flex;align-items:center;gap:10px}
.band::after{content:"";flex:1;height:1px;background:var(--line)}

section{padding-block:28px;display:grid;gap:18px;scroll-margin-top:16px}
.sec-head{display:flex;gap:14px;align-items:baseline}
.sec-no{font-family:var(--f-mono);color:var(--hull);font-size:.9rem}
.sec-sub{color:var(--muted);font-size:.9rem;max-width:70ch}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2x{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;display:grid;gap:8px;align-content:start}
.card p,.card li{font-size:.9rem}
.card ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.src{font-size:.74rem;color:var(--muted)}

/* thesis */
.thesis{background:var(--ink);color:var(--bg);border-radius:12px;padding:22px 24px;display:grid;gap:16px}
.thesis .lbl{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.thesis h3{font-size:1.25rem}
.thesis-cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.thesis ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}

/* cycle gauge */
.cycle{display:grid;gap:10px}
.cyc-track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cyc-seg{padding:8px 6px;text-align:center;font-size:.8rem;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.cyc-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.cyc-row .lbl{text-transform:none;letter-spacing:0;font-size:.8rem}
.cyc-seg.on{background:var(--hull-soft);border-color:var(--hull);color:var(--ink);font-weight:600}
.cyc-seg.on2{background:var(--sea-soft);border-color:var(--sea);color:var(--ink);font-weight:600}

/* KPI */
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.1}
.kpi .v small{font-size:.85rem;color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600;width:max-content}
.p-good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

/* value chain */
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.chain .card{border-top:3px solid var(--sea)}
.chain .card.core{border-top-color:var(--hull)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:720px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.76rem;background:color-mix(in srgb,var(--line) 35%,transparent)}
tr:last-child td{border-bottom:0}
td.neg{color:var(--bad)} td.pos{color:var(--good)}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 92px;gap:10px;align-items:center;font-size:.85rem}
.bar-track{height:14px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--sea);border-radius:3px}
.bar-fill.hull{background:var(--hull)}
.bar-row .r{text-align:right;font-variant-numeric:tabular-nums}

/* five forces */
.force{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--hull)}

/* calculator */
.calc{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.inputs{display:grid;gap:10px}
.inputs label{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;font-size:.88rem}
.inputs input{font:inherit;font-variant-numeric:tabular-nums;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.big{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--hull)}
.sens td.hit{background:var(--hull-soft);font-weight:700}

/* scenarios */
.scn .card{border-top:3px solid var(--line)}
.scn .bull{border-top-color:var(--good)} .scn .base{border-top-color:var(--sea)} .scn .bear{border-top-color:var(--bad)}

/* timeline */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl-item{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0 10px 18px;position:relative}
.tl-item::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--sea)}
.tl-item.past::before{background:var(--sea)}
.tl-when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tl-item p{font-size:.9rem}

/* checklist */
.chk{display:grid;gap:8px}
.chk label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--hull)}
.chk .why{display:block;color:var(--muted);font-size:.82rem}
.progress{font-size:.85rem;color:var(--muted)}

.gap{border-style:dashed;background:transparent}
.gap .lbl{color:var(--warn)}
footer{padding-block:32px;border-top:1px solid var(--line);margin-top:24px;font-size:.82rem;color:var(--muted);display:grid;gap:10px}
footer ol{margin:0;padding-left:20px;display:grid;gap:3px}
footer li{word-break:break-all}

@media (max-width:520px){
  .bar-row{grid-template-columns:84px 1fr 70px}
  .tl-item{grid-template-columns:1fr;gap:2px}
  .cyc-seg{font-size:.7rem;padding:6px 2px}
  .cyc-row{grid-template-columns:52px 1fr}
}
@media (prefers-reduced-motion:no-preference){.bar-fill{transition:width .5s ease}}
/* ---- charts (shared with charts.js) ---- */
.c-svg{display:block;max-width:100%;overflow:visible}
.c-ax{font:11px var(--f-body);fill:var(--muted)}
.c-ax-b{font:600 11.5px var(--f-body);fill:var(--ink)}
.c-val{font:600 12px var(--f-display);fill:var(--ink)}
.c-ref{font:600 11px var(--f-body);fill:var(--hull)}
.c-zone{font:600 11px var(--f-body);fill:var(--muted)}
.c-num{font:700 11px var(--f-display);fill:var(--on-fill)}
.c-tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:6px;max-width:260px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.c-hb{display:grid;gap:10px}
.c-hb-row{display:grid;grid-template-columns:minmax(78px,118px) 1fr 84px;gap:10px;align-items:center;font-size:.85rem}
.c-hb-t{position:relative;height:14px;background:var(--track);border-radius:0 4px 4px 0}
.c-hb-f{height:100%;border-radius:0 4px 4px 0}
.c-hb-ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--hull);z-index:1}
.c-hb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.c-note{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:8px}
.c-key-ref{display:inline-block;width:16px;border-top:2px dashed var(--hull)}
.c-st{display:flex;gap:2px;height:34px;border-radius:6px;overflow:hidden}
.c-st-s{display:flex;align-items:center;padding:0 8px;min-width:0}
.c-st-s span{font-size:.78rem;font-weight:600;color:var(--on-fill);white-space:nowrap;overflow:hidden}
.c-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:8px}
.c-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-rg{display:grid;gap:8px}
.c-rg-t{position:relative;height:14px;background:var(--track);border-radius:7px}
.c-rg-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sea) 38%,transparent);border-radius:7px}
.c-rg-mid{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--sea);border-radius:2px}
.c-rg-now{position:absolute;top:-1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--hull);box-shadow:0 0 0 2px var(--surface)}
.c-rg-k{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--muted)}
.c-rg-k i{display:inline-block;margin-right:5px;vertical-align:0}
.k-band{width:14px;height:8px;background:color-mix(in srgb,var(--sea) 38%,transparent);border-radius:4px}
.k-mid{width:3px;height:10px;background:var(--sea)}
.k-now{width:9px;height:9px;border-radius:50%;background:var(--hull)}
.chart-card h3{font-size:.95rem}
.chart-card .take{font-size:.86rem;color:var(--muted)}
.chart{min-width:0}
</style>

<script src="../assets/charts.js"></script>
<script>
/* ============================================================
   산업 데이터. 새 산업은 같은 구조의 객체를 INDUSTRIES에 추가하면 됩니다.
   모든 수치는 출처 번호(src)를 달고, 확인 못 한 항목은 gap으로 표시합니다.
   ============================================================ */
const INDUSTRIES = {
ship: {
  name:"조선",
  title:"조선업: 실적은 정점으로, 주가는 반토막",
  lede:"한국 조선 3사는 2026년 1~3분기에 이미 2025년 연간 영업이익을 넘겼습니다. 같은 기간 주가는 5월 고점 대비 54~67% 빠졌습니다. 이익의 질과 2028년 이후 수주 지속성, 이 두 가지가 지금 판단의 핵심입니다.",
  asof:"데이터 기준: 2026-11-24 작성. 주가·멀티플은 2026-11-05 종가(메리츠) 기준이라 현재가와 다를 수 있습니다.",

  thesis:{
    headline:"이익 사이클은 2028년까지 보이고, 주가는 2029년 이후 수주를 걱정하고 있다",
    why:[
      "3사 백로그 약 1,454억 달러(약 200조원), 2028년 인도 슬롯 소진 [7][9]",
      "고선가 수주분 매출 인식 본격화로 영업이익률 10~17%대 진입 [1][3]",
      "미국 LNG 프로젝트, MASGA(함정·MRO) 같은 신규 수요축 [4][6]",
      "고점 대비 주가 -54~-67%로 멀티플 압축 [6][9]"
    ],
    wrong:[
      "LNG선 선가가 꺾이고 중국이 LNG선 점유율을 빼앗는 경우 [2][7]",
      "2029년 이후 슬롯이 채워지지 않아 신규 수주가 백로그를 못 메우는 경우",
      "원화 강세로 환산이익이 줄어드는 경우(분기 -700억원 사례) [3]",
      "미국 LNG 인허가 지연이 장기화하는 경우 [7]"
    ],
    exit:[
      "분기 신규수주가 매출 인식액을 2개 분기 연속 밑돌 때",
      "클락슨 신조선가지수가 3개월 연속 하락할 때",
      "LNG선 신조가가 2.4억 달러 아래로 내려갈 때"
    ]
  },

  cycle:{
    phases:["침체","회복","호황","둔화"],
    rows:[
      {label:"수주",on:3,cls:"on",note:"글로벌 발주는 2026년 1~8월 +60%로 견조하지만 한국 점유율은 하락. 한국 관점에서 호황 후반에서 둔화 초입."},
      {label:"실적",on:2,cls:"on2",note:"2023~24년 고선가 수주분이 매출로 잡히는 구간. 2027~28년까지 이익 증가 전망."},
      {label:"주가",on:3,cls:"on",note:"5월 고점 이후 급락. 시장은 이익보다 2029년 이후 수주를 먼저 가격에 반영 중."}
    ]
  },

  indicators:[
    {k:"클락슨 신조선가지수",v:"186.34",u:"pt",d:"2026년 8월, 연중 최고. 2021년 8월 145.97",tone:"good",tag:"상승",src:[2]},
    {k:"글로벌 발주 (1~8월)",v:"5,972",u:"만 CGT",d:"전년 동기 +60%. 2025년 연간 6,691만 CGT",tone:"good",tag:"견조",src:[2]},
    {k:"한국 수주 점유율 (1~8월)",v:"16.8",u:"%",d:"중국 81.1%. 8월 단월 한국 7%로 연중 최저",tone:"bad",tag:"하락",src:[8]},
    {k:"대형 LNG선 한국 점유율",v:"57.9",u:"%",d:"2026년 1~10월 76척 중 44척. 중국 저가 공세 확대",tone:"warn",tag:"방어 중",src:[5]},
    {k:"3사 수주잔고",v:"1,454",u:"억 달러",d:"약 200조원. 3.5년치 일감. 가동률 100% 수준",tone:"good",tag:"충분",src:[7,9]},

function bindCalc(){
  const $=id=>document.getElementById(id);
  const f=(roe,coe,g)=>coe-g<=0?NaN:(roe-g)/(coe-g);
  function upd(){
    const roe=+$("in-roe").value, coe=+$("in-coe").value, g=+$("in-g").value, bps=+$("in-bps").value;
    const p=f(roe,coe,g);
    $("out-pbr").textContent=isFinite(p)?p.toFixed(2)+"배":"COE가 g보다 커야 합니다";
    $("out-px").textContent=isFinite(p)&&bps>0?`BPS ${bps.toLocaleString()}원 × ${p.toFixed(2)}배 = 적정주가 ${Math.round(bps*p).toLocaleString()}원`:"";
    const rs=[-10,-5,0,5,10].map(d=>Math.round((roe+d)*10)/10).filter(x=>x>0);
    const cs=[-1,-0.5,0,0.5,1].map(d=>Math.round((coe+d)*10)/10);
    $("sens-h").innerHTML=`<tr><th>ROE \\ COE</th>${cs.map(c=>`<th>${c}%</th>`).join("")}</tr>`;
    $("sens-b").innerHTML=rs.map(r=>`<tr><td>${r}%</td>${cs.map(c=>{const v=f(r,c,g);return `<td class="${r===Math.round(roe*10)/10&&c===Math.round(coe*10)/10?"hit":""}">${isFinite(v)?v.toFixed(1):"-"}</td>`}).join("")}</tr>`).join("");
    const tds=[...$("sens-b").querySelectorAll("td:not(:first-child)")];const vs=tds.map(t=>parseFloat(t.textContent)).filter(isFinite);const mx=Math.max(...vs),mn=Math.min(...vs);
    tds.forEach(t=>{const v=parseFloat(t.textContent);if(isFinite(v)&&!t.classList.contains("hit"))t.style.background=`color-mix(in srgb,var(--sea) ${Math.round(6+(v-mn)/((mx-mn)||1)*40)}%,transparent)`});
  }
  ["in-roe","in-coe","in-g","in-bps"].forEach(id=>$(id).addEventListener("input",upd));
  upd();
}
function bindChecklist(D){
  const key="chk-"+D.name; let st={};
  try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  const boxes=[...document.querySelectorAll('.chk input')];
  const p=document.getElementById("chk-p");
  const upd=()=>{const n=boxes.filter(b=>b.checked).length;p.textContent=`${n} / ${boxes.length} 확인`;const b=document.getElementById("chk-bar");if(b)b.style.width=(n/boxes.length*100)+"%"};
  boxes.forEach((b,i)=>{b.checked=!!st[i];b.addEventListener("change",()=>{st[i]=b.checked;try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}upd()})});
  upd();
}
function drawCharts(D){
  const K=Charts, G=D.charts;
  K.mount(document.getElementById("ch-op"),K.columns({data:G.op,dec:1,unit:"조원",ref:G.opRef,title:"3사 영업이익"}));
  K.hbars(document.getElementById("ch-dd"),{data:G.dd,max:100});
  K.stack(document.getElementById("ch-share"),{data:G.share,dec:1,unit:"%"});
  K.mount(document.getElementById("ch-nbpi"),K.columns({data:G.nbpi,dec:1,unit:"pt",title:"신조선가지수"}));
  K.mount(document.getElementById("ch-kr"),K.line({labels:G.kr.labels,series:[{color:"var(--hull)",points:G.kr.values.map(y=>({y}))}],unit:"%",unitShort:"%",labelAll:true,ref:G.kr.ref,area:true}));
  K.hbars(document.getElementById("ch-orders"),{data:G.orders,max:150,ref:{value:100,label:"연간 목표 100%"}});
  K.mount(document.getElementById("ch-plate"),K.line({labels:G.plate.labels,series:[{color:"var(--sea)",points:G.plate.values.map(y=>({y}))}],unit:"$/톤",yMin:G.plate.yMin,labelAll:true,dec:0}));
  K.stack(document.getElementById("ch-lng"),{data:G.lng,unit:"척"});
  K.mount(document.getElementById("ch-radar"),K.radar({axes:D.forces.map(f=>({label:f.k,value:f.s})),max:5,title:"5 Forces"}));
  K.hbars(document.getElementById("ch-roe"),{data:G.roe,unit:"%",dec:1,ref:{value:7.8,label:"자기자본비용 7.8%"}});
  K.hbars(document.getElementById("ch-slots"),{data:G.slots,unit:"척"});
  K.stack(document.getElementById("ch-scn"),{data:D.scenarios.map(s=>({label:s.t,value:parseFloat(s.p),color:s.cls==="bull"?"var(--good)":s.cls==="bear"?"var(--bad)":"var(--sea)"})),unit:"%"});
  K.mount(document.getElementById("ch-risk"),K.scatter({x:[0.5,5.5],y:[0.5,5.5],xs:1,ys:1,xf:()=>"",yf:()=>"",xLabel:"발생 가능성 (낮음 → 높음)",yLabel:"영향 (작음 → 큼)",height:300,
    zones:[{x:[3.5,5.5],y:[3.5,5.5],color:"var(--hull)",op:.1}],zoneLabels:[{x:5.4,y:5.25,t:"우선 관리",anchor:"end"}],
    points:D.risks.map((r,i)=>({x:r.p,y:r.i,num:i+1,r:11,color:r.lvl==="bad"?"var(--hull)":"var(--warn)",showLabel:false,tip:`${i+1}. ${r.t} · 가능성 ${r.p} · 영향 ${r.i}`}))}));
}
render(INDUSTRIES.ship);

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선업 산업 리포트 · 산업동향 분석기</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 항해일지형 단일 칼럼. 상단 논지·사이클 → 중단 구조·매력도(PE) → 하단 가격·재무·딜(IB). 섹션 번호는 읽는 순서. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#13202B; --muted:#5A6874; --line:#D9DFE4;
  --hull:#B23A2E; --sea:#1D6A74; --sea-soft:#E1EEF0; --hull-soft:#F6E5E2;
  --good:#2F7D4A; --warn:#A86A12; --bad:#B23A2E;
  --grid:#E6EAED; --axis:#B9C3CB; --track:#E3E8EC; --on-fill:#FFFFFF; --c-hd:#008F86; --c-hw:#C0661A; --c-sh:#4258B0;
  --f-display:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171E; --surface:#16212A; --ink:#E4EAEE; --muted:#93A2AE; --line:#2A3843;
  --hull:#E0675A; --sea:#5DB3BE; --sea-soft:#17323A; --hull-soft:#3A201D;
  --good:#6CC48A; --warn:#E0A54A; --bad:#E0675A; --grid:#22303A; --axis:#3A4B57; --track:#22303A; --on-fill:#0F171E; --c-hd:#14A99D; --c-hw:#D07A2C; --c-sh:#6E7FD6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171E; --surface:#16212A; --ink:#E4EAEE; --muted:#93A2AE; --line:#2A3843;
  --hull:#E0675A; --sea:#5DB3BE; --sea-soft:#17323A; --hull-soft:#3A201D;
  --good:#6CC48A; --warn:#E0A54A; --bad:#E0675A; --grid:#22303A; --axis:#3A4B57; --track:#22303A; --on-fill:#0F171E; --c-hd:#14A99D; --c-hw:#D07A2C; --c-sh:#6E7FD6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:20px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.78rem;letter-spacing:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:disabled{color:var(--muted);cursor:not-allowed}
.tab:disabled::after{content:" · 준비 중";font-size:.75rem}

/* hero */
.hero{padding-block:36px 20px;display:grid;gap:20px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hull);font-weight:600}
.hero h1{font-size:clamp(1.8rem,4.6vw,2.8rem)}
.hero .lede{max-width:68ch;color:var(--muted);font-size:1.02rem}
.asof{font-size:.8rem;color:var(--muted)}

/* nav */
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;padding-block:10px;border-block:1px solid var(--line);margin-bottom:8px}
.toc a{color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--ink)}
.band{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-block:32px 4px;display:flex;align-items:center;gap:10px}
.band::after{content:"";flex:1;height:1px;background:var(--line)}

section{padding-block:28px;display:grid;gap:18px;scroll-margin-top:16px}
.sec-head{display:flex;gap:14px;align-items:baseline}
.sec-no{font-family:var(--f-mono);color:var(--hull);font-size:.9rem}
.sec-sub{color:var(--muted);font-size:.9rem;max-width:70ch}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2x{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;display:grid;gap:8px;align-content:start}
.card p,.card li{font-size:.9rem}
.card ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.src{font-size:.74rem;color:var(--muted)}

/* thesis */
.thesis{background:#14212C;color:#E9EFF3;border:1px solid #24343F;border-radius:12px;padding:22px 24px;display:grid;gap:16px}
.thesis .lbl{color:#9FB1BE;font-weight:600}
.thesis h3{font-size:1.3rem;color:#FFFFFF}
.thesis li{color:#DCE5EB}
.thesis .src{color:#8FA4B3}
.thesis a{color:#7FD0DA}
.thesis-cols>div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px}
.thesis-cols>div:nth-child(2) .lbl{color:#F0A49B}
.thesis-cols>div:nth-child(3) .lbl{color:#F2C27A}
.thesis-cols>div:nth-child(1) .lbl{color:#8FD6A6}
.thesis-cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.thesis ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}

/* cycle gauge */
.cycle{display:grid;gap:10px}
.cyc-track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cyc-seg{padding:8px 6px;text-align:center;font-size:.8rem;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.cyc-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.cyc-row .lbl{text-transform:none;letter-spacing:0;font-size:.8rem}
.cyc-seg.on{background:var(--hull-soft);border-color:var(--hull);color:var(--ink);font-weight:600}
.cyc-seg.on2{background:var(--sea-soft);border-color:var(--sea);color:var(--ink);font-weight:600}

/* KPI */
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.1}
.kpi .v small{font-size:.85rem;color:var(--muted);font-weight:500}
.kpi .pk{font-size:.84rem;line-height:1.55;background:var(--sea-soft);border-radius:8px;padding:7px 9px;margin:2px 0}
.kpi .pk .pk-l{color:var(--muted)}.kpi .pk b{font-weight:700}.kpi .pk .pk-c{display:block;font-weight:600;margin-top:2px}
.c-sr{margin:4px 0 12px}.c-sr-l{font-size:.82rem;color:var(--muted);margin:0 0 4px;line-height:1.45}
.box2{border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--surface)}
.more-t{margin:12px 0}.more-t>summary{cursor:pointer;font-weight:600;color:var(--sea);padding:10px 0;font-size:.95rem}.more-t[open]>summary{margin-bottom:8px}
.box2 h3{margin:0 0 8px;font-size:1.02rem}.box2 p{margin:0 0 10px}.box2 ol,.box2 ul{margin:6px 0 0;padding-left:1.25em}.box2 li{margin:4px 0}
.box2.warn{border-left-color:var(--warn)}.box2.hull{border-left-color:var(--hull)}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600;width:max-content}
.p-good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

/* value chain */
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.chain .card{border-top:3px solid var(--sea)}
.chain .card.core{border-top-color:var(--hull)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:720px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.76rem;background:color-mix(in srgb,var(--line) 35%,transparent)}
tr:last-child td{border-bottom:0}
td.neg{color:var(--bad)} td.pos{color:var(--good)}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 92px;gap:10px;align-items:center;font-size:.85rem}
.bar-track{height:14px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--sea);border-radius:3px}
.bar-fill.hull{background:var(--hull)}
.bar-row .r{text-align:right;font-variant-numeric:tabular-nums}

/* five forces */
.force{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--hull)}

/* calculator */
.calc{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.inputs{display:grid;gap:10px}
.inputs label{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;font-size:.88rem}
.inputs input{font:inherit;font-variant-numeric:tabular-nums;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.big{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--hull)}
.sens td.hit{background:var(--hull-soft);font-weight:700}

/* scenarios */
.scn .card{border-top:3px solid var(--line)}
.scn .bull{border-top-color:var(--good)} .scn .base{border-top-color:var(--sea)} .scn .bear{border-top-color:var(--bad)}

/* timeline */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl-item{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0 10px 18px;position:relative}
.tl-item::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--sea)}
.tl-item.past::before{background:var(--sea)}
.tl-when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tl-item p{font-size:.9rem}

/* checklist */
.chk{display:grid;gap:8px}
.chk label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--hull)}
.chk .why{display:block;color:var(--muted);font-size:.82rem}
.progress{font-size:.85rem;color:var(--muted)}

.gap{border-style:dashed;background:transparent}
.gap .lbl{color:var(--warn)}
footer{padding-block:32px;border-top:1px solid var(--line);margin-top:24px;font-size:.82rem;color:var(--muted);display:grid;gap:10px}
footer ol{margin:0;padding-left:20px;display:grid;gap:3px}
footer li{word-break:break-all}

@media (max-width:520px){
  .bar-row{grid-template-columns:84px 1fr 70px}
  .tl-item{grid-template-columns:1fr;gap:2px}
  .cyc-seg{font-size:.7rem;padding:6px 2px}
  .cyc-row{grid-template-columns:52px 1fr}
}
@media (prefers-reduced-motion:no-preference){.bar-fill{transition:width .5s ease}}
/* ---- charts (shared with charts.js) ---- */
.c-svg{display:block;max-width:100%;overflow:visible}
.c-ax{font:11px var(--f-body);fill:var(--muted)}
.c-ax-b{font:600 11.5px var(--f-body);fill:var(--ink)}
.c-val{font:600 12px var(--f-display);fill:var(--ink)}
.c-ref{font:600 11px var(--f-body);fill:var(--hull)}
.c-zone{font:600 11px var(--f-body);fill:var(--muted)}
.c-num{font:700 11px var(--f-display);fill:var(--on-fill)}
.c-tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:6px;max-width:260px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.c-hb{display:grid;gap:10px}
.c-hb-row{display:grid;grid-template-columns:minmax(78px,118px) 1fr 84px;gap:10px;align-items:center;font-size:.85rem}
.c-hb-t{position:relative;height:14px;background:var(--track);border-radius:0 4px 4px 0}
.c-hb-f{height:100%;border-radius:0 4px 4px 0}
.c-hb-ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--hull);z-index:1}
.c-hb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.c-note{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:8px}
.c-key-ref{display:inline-block;width:16px;border-top:2px dashed var(--hull)}
.c-st{display:flex;gap:2px;height:34px;border-radius:6px;overflow:hidden}
.c-st-s{display:flex;align-items:center;padding:0 8px;min-width:0}
.c-st-s span{font-size:.78rem;font-weight:600;color:var(--on-fill);white-space:nowrap;overflow:hidden}
.c-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:8px}
.c-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-rg{display:grid;gap:8px}
.c-rg-t{position:relative;height:14px;background:var(--track);border-radius:7px}
.c-rg-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sea) 38%,transparent);border-radius:7px}
.c-rg-mid{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--sea);border-radius:2px}
.c-rg-now{position:absolute;top:-1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--hull);box-shadow:0 0 0 2px var(--surface)}
.c-rg-k{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--muted)}
.c-rg-k i{display:inline-block;margin-right:5px;vertical-align:0}
.k-band{width:14px;height:8px;background:color-mix(in srgb,var(--sea) 38%,transparent);border-radius:4px}
.k-mid{width:3px;height:10px;background:var(--sea)}
.k-now{width:9px;height:9px;border-radius:50%;background:var(--hull)}
.chart-card h3{font-size:.95rem}
.chart-card .take{font-size:.86rem;color:var(--muted)}
.chart{min-width:0}
.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.fact .v{font-family:var(--f-display);font-size:1.55rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.fact .v small{font-size:.8rem;color:var(--muted);font-weight:500}
.fact .cmp{font-size:.82rem;font-variant-numeric:tabular-nums}
.fact .mean{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.gloss{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gloss dl{margin:0}
.gloss .card dt{font-weight:600}
.gloss .card dd{margin:0;font-size:.88rem;color:var(--muted)}
.gloss .card dd b{color:var(--ink);font-weight:500}
.why{display:grid;gap:14px;border:1px solid var(--line);border-radius:12px;padding:18px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.why-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.why-h h3{font-size:1.15rem}
.why-h .pill{font-size:.78rem}
.why ul.ev{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.evt{width:100%;border-collapse:collapse;font-size:.86rem;min-width:720px}
.evt th,.evt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
.evt td.n{text-align:right;white-space:nowrap}
.evt .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:.75rem}
.vt{width:100%;border-collapse:collapse;font-size:.86rem;min-width:760px}
.vt th,.vt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.vt th:first-child,.vt td:first-child{text-align:left}
.vt td.basis{text-align:left;color:var(--muted);font-size:.8rem;white-space:normal;min-width:220px}
.vt input{width:76px;font:inherit;font-variant-numeric:tabular-nums;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
.vt tr.res td{font-weight:700;background:color-mix(in srgb,var(--sea) 8%,transparent)}
.steps2{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.88rem;font-variant-numeric:tabular-nums}
td.dn,span.dn{color:var(--bad)} td.up,span.up{color:var(--good)}

/* ---- v4 story layout ---- */
.chap{padding-block:44px 8px;display:grid;gap:20px;scroll-margin-top:12px;border-top:1px solid var(--line);margin-top:28px}
.chap-h{display:grid;gap:8px}
.chap-no{font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--hull)}
.chap-h h2{font-size:clamp(1.4rem,3.4vw,1.9rem)}
.chap-q{font-size:1rem;color:var(--muted);max-width:70ch}
.story{display:grid;gap:12px;max-width:74ch}
.story p{font-size:1rem;line-height:1.8}
.story b{color:var(--ink)}
.sub-h{font-size:1.12rem;font-weight:700;margin-top:10px}
.take2{border-left:4px solid var(--hull);background:var(--surface);border-radius:0 10px 10px 0;padding:14px 18px;display:grid;gap:6px}
.take2 .lbl{color:var(--hull);font-weight:700}
.take2 p{font-size:.98rem;line-height:1.7}
.summary{background:#14212C;color:#E9EFF3;border-radius:14px;padding:22px 24px;display:grid;gap:14px}
.summary .lbl{color:#9FB1BE;font-weight:600}
.summary ol{margin:0;padding-left:22px;display:grid;gap:10px}
.summary li{font-size:1rem;line-height:1.7;color:#DCE5EB}
.summary li b{color:#FFFFFF}
.summary a{color:#7FD0DA;white-space:nowrap}
.qnums{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qnums div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.qnums b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.qnums span{font-size:.8rem;color:var(--muted)}
.chapnav{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.chapnav a{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chapnav a:hover{border-color:var(--sea)}
.chapnav small{color:var(--hull);font-weight:700;font-size:.75rem}
.chapnav span{font-size:.84rem;color:var(--muted)}

  rateBox:{
    h:"국고채 10년 금리, 오르는 게 좋은가 내리는 게 좋은가",
    ps:["<b>주가를 평가하는 쪽에서는 내리는 것이 좋습니다.</b> 국고채 10년 금리는 5장 자본비용(COE = 국고채 10년 + 베타 × 시장위험프리미엄)의 출발점이라, 금리가 내리면 같은 이익도 더 높은 가치로 계산됩니다. 다만 그 크기는 생각보다 작습니다. 11/26 기본값(ω 0.5)에서 금리를 0.5%p 내리면 적정가는 HD현대중공업 165,845원 → 167,930원, 한화오션 36,438원 → 36,895원, 삼성중공업 8,297원 → 8,401원으로 모두 약 1.3% 오르고, 0.5%p 오르면 약 1.2% 내립니다. 이 모델에서는 이익이 잘 보이는 2027~28년의 비중이 커서 할인율의 영향이 작기 때문입니다. 같은 HD현대중공업이라도 ω(2029년 이후 수주)를 0.5에서 0.8로 바꾸면 적정가가 27% 움직입니다. 금리보다 2029년 이후 일감이 훨씬 큰 변수라는 뜻입니다.",
        "<b>실적 쪽에서는 한 방향으로 정해지지 않습니다.</b> 첫째, 금리와 환율의 관계입니다. 한국 금리가 내리면 원화가 약해지는 경향이 있고, 원화 약세는 달러로 받는 배값의 원화 이익을 늘립니다(원화 1% 강세 ≈ 영업이익 약 1% 감소 [1][6]). 그러나 2026년에는 금리가 9월 말 4.470%에서 11/26 3.776%로 내리는 동안 원화는 6월 1,541.8원에서 1,343.6원으로 오히려 강해져, 이 경로가 늘 맞지는 않았습니다 [19]. 둘째, 회사의 이자 부담입니다. 차입이 있는 삼성중공업은 2024년 이자비용이 2,132억원으로 2023년(1,786억원)보다 늘었고 2025년 4월 보도 기준 단기사채 이율이 4% 초반이었으니 금리가 내리면 부담이 줄고 [57], 순현금이 약 11조원인 HD한국조선해양은 반대로 이자수익이 줄 수 있습니다 [3]. 셋째, 선주의 발주 비용입니다. 선주는 배값을 선박금융으로 마련하는 경우가 많아 금리가 낮을수록 발주가 쉬워지는데, 이때 중요한 것은 한국 국고채보다 달러 금리입니다(일반적인 경로이며, 이 리포트가 수치로 확인하지는 않았습니다)."],

  credit:[

  why:{
    orders:{h:"① 수주는 왜 '둔화 초입'인가",tag:"세계 발주는 많지만 한국 몫과 고부가 선종이 줄고 있다",
      pts:["먼저 시장 전체를 보면 주문은 많았습니다. 2026년 1~10월 세계 선박 발주량은 7,969만 CGT로 1년 전 같은 기간(4,951만 CGT)보다 61% 늘었습니다. 그런데 한국이 받은 물량은 1,191만 CGT로 46% 늘어나는 데 그쳐, 한국의 몫(점유율)은 16.4%에서 14.9%로 내려갔습니다. 같은 기간 중국은 수주를 95% 늘려 점유율이 63.3%에서 76.6%로 올라갔습니다 [14]. 시장이 커진 만큼의 대부분을 중국이 가져간 셈입니다.",
           "더 중요한 것은 무엇을 받았느냐입니다. 한국 조선사 이익의 중심인 대형 LNG 운반선의 세계 발주는 상반기 59척, 한 달 평균 9.8척이었는데, 7~10월에는 17척, 한 달 평균 4.3척으로 절반 아래로 줄었습니다. 10월 한 달 7척 가운데 5척은 중국이 수주했습니다 [17]. 한국은 1~10월 누계로 76척 중 44척(57.9%)을 가져가 여전히 1위지만, 1~7월 61%에서 비중이 줄고 있습니다 [16].",
           "컨테이너선에서는 변화가 더 큽니다. 1.5만 TEU 이상 초대형 컨테이너선은 2026년 1~10월 중국이 93척(94%), 한국이 6척(6%)을 수주했습니다. 2023년에는 한국 21척, 중국 16척으로 한국이 더 많았습니다 [16].",
           "가격도 방향을 틀었습니다. 클락슨 신조선가지수는 10월 말 187.20으로 2008년 사상 최고(191.51)에 가까운 고점권이지만, 8월 이후에는 매달 0.1~0.3%씩만 올랐습니다. 선종별로는 LNG선 가격이 8월 2억4,850만 달러에서 10월 2억4,500만 달러로, 2.2만~2.4만 TEU 컨테이너선은 1년 전 2억6,650만 달러에서 2억4,000만 달러로(−9.9%) 내려갔습니다 [14][16]. 주문이 줄고 가격이 내려가는 선종이 하필 한국의 주력이라는 점에서, 이 리포트는 한국 조선사의 수주 사이클을 '호황 후반에서 둔화로 넘어가는 초입'으로 판단합니다."]},
    earn:{h:"② 실적은 왜 '호황'인가",tag:"2~3년 전에 비싸게 받은 배가 지금 매출로 잡힌다",
      pts:["1장에서 본 것처럼 조선사의 매출은 계약 때 정한 배값이 2~3년의 건조 기간 동안 공정 진행률만큼 나뉘어 잡힙니다. 그래서 2026년 이익을 결정하는 것은 2026년의 선가가 아니라 2023~24년에 계약한 선가입니다. 당시 대형 LNG선 가격은 2억5,600만 달러(2023년 4월)에서 2억6,100만 달러(2024년 10월)로, 지금(2억4,500만 달러)보다 높았습니다 [25][16].",
           "반면 원가는 그만큼 오르지 않았습니다. 선체 건조 원가에서 가장 큰 단일 항목인 후판 가격은 2026년 톤당 620달러로 2025년보다 4.3% 오르는 데 그칠 것으로 추정됩니다 [6][37]. 비싸게 받은 배를 상대적으로 덜 오른 원가로 짓고 있으니 마진이 벌어지는 것입니다.",
           "숫자로 확인하면 2026년 2분기 영업이익은 HD한국조선해양 1조6,451억원(전년 대비 +72.5%), 한화오션 7,361억원(+98%), 삼성중공업 3,250억원(+58.7%)이었고, 3분기 3사 합계는 2조2,713억원으로 43.6% 늘었습니다. 4분기 추정치는 2조4,845억원(+57.1%)입니다 [22].",
           "그리고 3사의 수주잔고 1,454억 달러(약 200조원)는 연간 매출의 약 3.5년치로, 2028년 인도분까지 도크가 대부분 차 있습니다 [7][9]. 그래서 이 리포트는 실적 사이클을 '호황'으로 판단하고, 이익이 2028년까지 늘어날 가능성이 높다고 봅니다."]},
    price:{h:"③ 주가는 왜 '둔화'인가",tag:"이익보다 2029년 이후 일감과 정책 변수를 먼저 반영했다",
      pts:["먼저 숫자로 확인하겠습니다. HD현대중공업 종가가 가장 높았던 2026년 5월 26일부터 11월 26일까지 세 회사 종가는 HD현대중공업 745,000원 → 238,500원(−68.0%), 한화오션 134,700원 → 41,400원(−69.3%), 삼성중공업 30,450원 → 13,900원(−54.4%)으로 내렸습니다. 같은 기간 코스피도 8,047에서 4,711로 41.5% 내렸지만, 조선주의 낙폭은 코스피의 1.3~1.7배였습니다. 회사마다 종가 고점은 날짜가 달라서, 각자의 2026년 종가 고점에서 재면 한화오션 149,900원(1/13·2/20) → −72.4%, 삼성중공업 34,400원(4/24) → −59.6%, HD현대중공업 745,000원(5/26) → −68.0%입니다. 기간을 18개월로 넓히면 차이가 더 분명합니다. 2025년 5월 2일부터 2026년 11월 26일까지 코스피는 2,560에서 4,711로 84.0% 올랐는데, HD현대중공업은 408,500원 → 238,500원(−41.6%), 한화오션은 78,900원 → 41,400원(−47.5%), 삼성중공업은 14,610원 → 13,900원(−4.9%)이었습니다 [12]. 아래 표에 세 회사의 가격을 시점별로 모았습니다.",
           "5/26 이후 표의 이벤트를 보면, 좋은 뉴스(반발 매수, 트럼프의 협력 발언, 2분기 실적, 수주, 미 해군 첫 수주)가 나온 6/10·7/16·7/30·9/3·11/2에는 3사 평균이 코스피보다 5.3~9.9%p 더 올랐고, 나쁜 뉴스(미 의회의 해외 건조 제한, 캐나다 잠수함 탈락, 중국과의 경쟁 우려, 3분기 실적 하회)가 나온 6/9·7/7·10/20·10/28에는 3.5~9.3%p 더 빠졌습니다. 하루 단위의 폭은 비슷했지만 좋은 뉴스 뒤의 반등은 이어지지 않았고 나쁜 뉴스는 쌓였습니다. 그 결과 5/26 이후 3사는 코스피보다 13~28%p 더 내렸습니다. 아래 그래프 4-2·4-3과 표에서 날짜별로 확인할 수 있습니다.",
           "10월 한 달 동안 HD현대중공업은 36.8% 내려 같은 기간 코스피(−16.2%)보다 두 배 넘게 빠졌습니다. 중국의 LNG선 생산능력 확대에 따른 선가 압박과 컨테이너선 수주가 이어질지에 대한 의문이 원인으로 꼽혔습니다 [22].",
           "3분기 실적 발표 뒤에는 증권사 10곳 이상이 목표주가를 내렸고(최대 −54%), 2027~28년 이익 추정치도 낮아졌습니다 [22]. 이익이 아직 늘고 있는데도 주가가 먼저 꺾인 것은, 2장에서 본 '주가 → 선가·수주 → 실적' 순서가 이번에도 반복되고 있을 가능성을 보여 줍니다."]}
  },

    prem:{
      ps:["용어부터 정리합니다. 현재가가 적정가보다 높으면 <b>프리미엄</b>, 낮으면 <b>디스카운트</b>라고 씁니다(이전 버전의 '할증·할인'을 바꿨습니다). 11/26 종가와 기본값(CAPM 자본비용, ω 0.5)으로 계산하면 HD현대중공업은 적정가 165,845원보다 43.8%, 한화오션은 36,438원보다 13.6%, 삼성중공업은 8,297원보다 67.5% 프리미엄입니다.",
          "프리미엄이 붙었다는 것은 시장이 이 계산과 다른 가정을 쓰고 있다는 뜻입니다. 아래 표는 '현재가가 맞으려면 ω나 자본비용이 얼마여야 하는가'를 거꾸로 푼 결과입니다."],
      note:"ω는 2029년 이후 초과이익이 매년 남는 비율(0~1). '0.99로도 부족'은 초과이익이 영원히 거의 줄지 않는다고 가정해도 현재가에 못 미친다는 뜻입니다. 계산표의 금리·베타·ROE·ω를 바꾸면 이 표도 다시 계산됩니다.",
      why:["<b>① 시장은 더 낮은 할인율을 쓰고 있습니다.</b> 초과이익이 오래 간다고(ω 0.8) 놓으면 현재가가 정당화되는 자본비용은 HD현대중공업 9.5%, 한화오션 10.9%, 삼성중공업 4.2%로, CAPM 12.4~12.7%보다 낮습니다. HD현대중공업·한화오션은 증권사(메리츠)가 쓰는 7.8%보다는 높습니다 [6]. 투자자들이 회계사회 설문 위험프리미엄(8.167%)보다 낮은 위험을 요구하고 있거나 [20], 증권사 추정 이후의 이익을 더 높게 본다는 뜻입니다.",
           "<b>② 2029년 이후에도 초과이익이 오래 간다고 봅니다.</b> CAPM 자본비용을 그대로 두면 현재가가 맞으려면 ω가 HD현대중공업 0.87, 한화오션 0.93이어야 합니다. 2029년 이후 초과이익이 매년 87~93%씩 남는다는 뜻으로, 2·3장에서 본 수주 둔화(한국 점유율 16.4% → 14.9%, LNG선 발주 월 9.8척 → 4.3척 [14][17])와는 거리가 있는 낙관입니다.",
           "<b>③ 추정치에 다 들어가지 않았을 수 있는 선택지가 있습니다.</b> MASGA 1,500억 달러 [44], 미 해군 상륙함(LSM) 35척 계획과 첫 수주 2.69억 달러 [4], 한국 핵추진잠수함 건조 승인 [51]입니다. 이 사업들이 증권사 2027~28년 추정치에 얼마나 들어 있는지는 확인하지 못했습니다.",
           "<b>④ 모델이 단순화한 부분도 있습니다.</b> 이 모델은 이익을 전부 장부에 쌓는다고 가정해 배당(HD현대중공업 2026E 주당 12,500원, 현재가의 5.2% [6])을 빼지 않습니다. 주당 12,500원을 2027년 BPS에서 빼면 HD현대중공업 기본 적정가는 165,845원에서 161,191원으로 2.8% 낮아집니다. 즉 이 단순화를 바로잡으면 프리미엄은 줄지 않고 조금 커집니다. 삼성중공업은 2029년 LNG선 슬롯의 75%를 이미 채웠다는 점(메리츠 [6])이 2029년 이후 이익을 받쳐 주지만, CAPM 기준으로는 ω를 0.99로 올려도 현재가를 설명하지 못합니다. 세 회사 가운데 '미래에 대한 낙관'이 가장 많이 들어간 주가입니다."]},
    cheap:{
      intro:"'저평가'는 무엇을 기준으로 보느냐에 따라 답이 달라집니다. 순자산과 자본비용(5장 계산), 이익 대비 가격, 재무 안정성을 나눠서 11/26 종가로 비교했습니다.",

      src:"PBR·PER은 메리츠 2027E 추정치를 11/26 종가로 다시 계산 [6]. 목표가 평균은 4장 주가 현황 표와 같음 [6][11]. 재무 [3][10][57], 신용등급 [57], 배당 [6].",
      ps:["<b>순자산·자본비용 기준(위 4줄)으로는 한화오션이 가장 덜 비쌉니다.</b> 기본 적정가 대비 프리미엄이 13.6%로 가장 작고, 증권사 가정으로는 적정가보다 12.5% 낮으며, PBR도 1.07배로 가장 낮습니다. 다만 이유가 있는 저PBR입니다. 메리츠는 한화오션의 2027E ROE를 6.9%로 자본비용보다 낮게 보고, 2027E 영업이익이 2026E 5.1조원에서 1.4조원으로 급감한다고 추정합니다(2026년 일회성 포함) [6]. 그래서 PER은 15.5배로 가장 높습니다.",
          "<b>이익·재무 기준(다음 7줄)으로는 HD현대중공업이 가장 쌉니다.</b> PER 6.5배로 가장 낮고, ROE가 가장 높아 이익 대비 가격(PBR ÷ ROE)이 가장 작으며, 목표가 상승여력도 +190%로 가장 큽니다. 3사 중 유일하게 배당이 있고(5.2%), 신용등급도 가장 높습니다(AA-).",
          "<b>삼성중공업은 두 기준 모두에서 가장 비쌉니다.</b> 기본 적정가 대비 67.5% 프리미엄이고, 현재가를 설명하려면 자본비용이 4.2%여야 합니다.",
          "<b>이 리포트의 결론: 한 곳만 고르면 이익과 재무를 함께 볼 때 HD현대중공업이 가장 저평가돼 있습니다.</b> 숫자만 보면 한화오션이 가장 싸 보이지만, 2027년 이익 급감이라는 분명한 이유가 있습니다. 세 회사 모두 CAPM 자본비용 기준으로는 기본 적정가보다 비싸므로, 여기서 '저평가'는 '싸다'가 아니라 '셋 중 덜 비싸다'는 뜻입니다. 투자 권유가 아닙니다."]},

    pp:["위 막대는 조선 3사 영업이익 합계, 아래 막대는 같은 해 3사 주가의 평균 등락률(연말 종가 기준)입니다. 이익과 회사 범위를 맞추려고 HD 쪽은 HD현대중공업(2021년 상장)이 아니라 모회사 HD한국조선해양(2019년 이전 현대중공업) 주가를 썼습니다 [53].",
        "<b>바닥에서는 주가가 먼저 돌았습니다.</b> 2023년 영업이익은 3,191억원으로 겨우 흑자였지만 주가는 평균 +58% 올랐고, 이익이 본격적으로 늘어난 2024년(2.2조원)과 2025년(5.9조원)에 +61%, +132%가 이어졌습니다. 2021년에도 영업이익은 −4.5조원으로 2016년 이후 가장 나빴지만, 한국이 세계 발주의 52%를 가져가던 2020년 말~2021년 4월에 HD한국조선해양 주가는 108,500원에서 153,500원으로 41% 올랐습니다 [33][53]. 이익이 나빠도 수주가 살아나면 주가가 먼저 반응한 것입니다.",
        "<b>정점에서도 주가가 먼저 꺾였습니다.</b> 2026년 영업이익은 9.8조원으로 사상 최대가 예상되지만, 3사 주가는 11/26까지 평균 −50%입니다. 2029년 이후 일감을 먼저 걱정하고 있다는 뜻입니다(3·4장).",
        "<b>숫자로 본 연동 정도:</b> 2015~2025년 11개 연도에서 그해 주가 등락률과 그해 영업이익 수준의 상관계수는 0.81로 높지만, 2015년(−8.5조원, −47%)과 2025년(+5.9조원, +132%) 두 극단값의 영향이 큽니다. 다음 해 이익 변화와의 상관은 0.03으로 거의 없어, 연 단위로 '주가가 정확히 1년 앞선다'는 규칙은 보이지 않았습니다. '이익의 방향이 바뀌는 전환점에서 주가가 먼저 움직인다' 정도로 읽는 것이 맞습니다.",
        "주의: 연말 종가는 Yahoo Finance의 분할·감자 반영 수정주가입니다. 대우조선해양은 2016년 7월~2017년 10월 거래가 정지돼(이 기간 종가 변동 없음) 2016~2017년 값의 의미가 작고, 현대중공업은 2017년 회사 분할 전후로 사업 범위가 달라졌습니다 [53]. 2016·2019~2022·2024년 영업이익은 회사별 보도치를 더한 값입니다 [54][55][56]."],

  primer:[
    {id:"p1",h:"1-1 무엇을 만드나: 선종과 크기 단위",
     paras:["조선사가 만드는 배는 크게 상선(화물을 나르는 배), 해양플랜트(바다 위에서 원유·가스를 생산하는 설비), 함정(군함)으로 나뉩니다. 새 배를 짓는 신조선이 조선사 매출의 80% 이상을 차지하고, 한 척을 짓는 데 2~3년이 걸립니다 [37].",
       "처음 보는 분이 가장 헷갈리는 것은 단위입니다. <b>DWT(재화중량톤)</b>는 배가 실을 수 있는 화물·연료의 무게로 유조선과 벌크선 크기에 씁니다. <b>TEU</b>는 20피트 컨테이너 1개로 컨테이너선 크기를, <b>㎥</b>는 화물창 부피로 LNG선·가스선 크기를 나타냅니다. 나라별·회사별 수주를 비교할 때는 <b>CGT(표준선 환산톤수)</b>를 씁니다. 배의 무게에 건조 난이도 계수를 곱한 값이라, 같은 무게라도 LNG선처럼 만들기 어려운 배는 CGT가 크게 잡힙니다. 2007년 한국이 CGT로는 중국을 앞섰지만 무게로는 중국이 앞섰던 것이 그 예입니다 [24]."],
     table:{cols:["선종","무엇을 싣나","크기 단위","최근 선가","한국 vs 중국"],rows:[
       ["대형 LNG 운반선","영하 162도로 액화한 천연가스","㎥ (17.4만㎥급이 표준)","2억4,500만 달러 (2026년 10월) [17]","2026년 1~10월 76척 중 한국 44척(57.9%), 중국 32척 [16]"],
       ["초대형 컨테이너선","컨테이너","TEU (2.2만~2.4만TEU급)","2억4,000만 달러 (2026년 10월) [16][17]","1.5만TEU 이상: 중국 93척(94%), 한국 6척 [16]"],
       ["VLCC (초대형 원유운반선)","원유","DWT","1억3,150만 달러 (2026년 10월, 1년 새 +4.4%) [17]","세계 탱커 평균 선령 13.7년, 발주잔량은 선대의 16.7%(DWT 기준) [49]"],
       ["VLGC · VLAC","LPG · 암모니아","㎥","이 리포트에서 미수집","HD한국조선해양이 세계 발주의 50% 이상 수주 [3]"],
       ["해양플랜트 (FPSO 등)","원유·가스 생산·저장 설비","프로젝트별","프로젝트별","2010년대 저가 수주가 2015년 대규모 손실의 원인 [29]"],
       ["함정 · MRO","군함 건조, 미 해군 함정 정비","척","한화 필리조선소 LSM 첫 수주 2.69억 달러 [4]","동맹국 조선소에만 열리는 미국 시장"]]},
     after:"한국 조선사의 이익은 LNG선처럼 기술 장벽이 높고 비싼 배에서 주로 나옵니다. 반대로 컨테이너선·벌크선처럼 표준화된 배는 중국이 가격으로 빠르게 점유율을 늘리는 영역입니다. 그래서 한국 조선주를 볼 때는 전체 점유율보다 <b>LNG선 같은 고부가 선종에서 몫을 지키는지</b>가 더 중요합니다."},
    {id:"p2",h:"1-2 계약과 대금: 선수금, 헤비테일, RG",
     paras:["배값은 한 번에 받지 않고 약 2년의 건조 기간 동안 보통 다섯 번에 나눠 받습니다 [38]. 불황기에는 선주의 힘이 세서 앞의 네 번은 10%씩, 인도할 때 60%를 받는 계약(10:10:10:10:60)이 많았고 [38], 2021년에도 인도 때 받는 잔금이 배값의 50% 이상이었습니다 [39]. 이렇게 마지막에 큰돈이 들어오는 구조를 <b>헤비테일</b>이라고 부릅니다. 호황이 이어지며 첫 회차 비중이 커지고 있다는 보도가 있지만 [38], 2025년에도 인도 때 60%를 받는 구조가 일반적이라는 설명이 나옵니다 [40].",
       "헤비테일 계약에서는 배를 짓는 동안 들어가는 자재비와 인건비를 조선사가 먼저 대야 합니다. 신용평가사는 조선사가 선수금과 인도대금으로 건조 자금을 돌려 막기 때문에 운전자본이 반복해서 크게 출렁인다고 설명합니다 [40]. 예를 들어 HD현대삼호는 2025년 1분기 순이익이 46% 늘었는데도, LNG선 한 척의 잔금 약 2,000억원이 아직 들어오지 않아 영업현금흐름은 26.9% 줄었습니다 [40]. <b>이익과 현금이 같은 분기에 움직이지 않는다</b>는 점을 기억해야 합니다.",
       "공정보다 먼저 받은 돈은 재무상태표에 <b>계약부채(선수금 포함)</b>로 잡힙니다. 2023년 1분기 말 계약부채는 HD한국조선해양 8조6,274억원(전체 부채의 47.5%), 한화오션 4조6,625억원(39.9%), 삼성중공업 4조2,131억원(38.5%)이었습니다 [38]. 호황기에는 선수금이 쌓여 현금이 많아 보이지만, 이는 앞으로 배를 지어 갚아야 할 몫입니다. 그래서 순현금은 수주가 줄면 빠르게 줄어들 수 있습니다.",
       "선주는 선수금을 내기 전에 <b>선수금환급보증(RG)</b>을 요구합니다. 조선소가 배를 제때 넘기지 못하면 은행이 선수금을 대신 돌려주겠다는 보증서로, RG가 없으면 계약이 성사되지 않습니다. 한국에서는 국책은행과 금융회사가 주로 발급하는데 대형사에 몰려 있습니다. 2025년 말 RG 한도는 대형 4개 조선소(HD현대중공업·HD현대삼호·삼성중공업·한화오션) 합계 560억 달러, 중형 3사(대한조선·케이조선·HJ중공업) 21억 달러였고, HJ중공업은 RG 부족 등으로 2025년 수주가 5억5천만 달러로 전년(8억8천만 달러)보다 줄었습니다 [41]. 투자자에게 RG 한도는 '받을 수 있는 주문의 최대치'를 가늠하는 숨은 변수입니다."]},
    {id:"p3",h:"1-3 회계: 이익은 언제, 어떻게 잡히나",
     paras:["한국 조선사는 K-IFRS 1115호에 따라 배를 짓는 기간에 걸쳐 매출을 나눠 인식합니다. 진행률은 대개 <b>지금까지 투입한 원가 ÷ 예상 총원가</b>로 계산합니다(투입원가법). 불량 재작업처럼 비정상적으로 들어간 원가는 진행률 계산에서 빼고, 아직 설치하지 않은 자재는 진행률을 부풀리지 않도록 따로 조정합니다 [37]."],
     ex:{t:"예시 (이해를 돕기 위한 가정 숫자)",ps:["선가 2억4,500만 달러인 LNG선의 예상 총원가가 2억 달러이고 지금까지 1억 달러를 썼다면 진행률은 50%입니다. 지금까지 누적 매출 1억2,250만 달러, 누적 이익 2,250만 달러가 잡힙니다.","그런데 남은 공정의 원가가 1,000만 달러 더 들 것으로 추정이 바뀌면, 새 진행률(1억 ÷ 2억1,000만 = 47.6%)로 누적 매출을 다시 계산합니다. 누적 매출은 약 1억1,667만 달러, 누적 이익은 약 1,667만 달러가 되어, 그 분기에 약 583만 달러의 이익이 한꺼번에 사라집니다."]},
     after2:["이 방식에서 투자자가 꼭 알아야 할 점이 세 가지 있습니다. 첫째, <b>손실이 예상되면 그 손실 전부를 그 분기에 미리 반영</b>합니다(공사손실충당금). 2021년 2분기 후판 가격이 2020년 톤당 60만원대에서 120만원대로 뛰자, 한국조선해양은 조선 부문에서 8,960억원, 삼성중공업은 3,720억원의 충당금을 쌓았고, 두 회사는 그 분기에 각각 8,973억원, 4,379억원의 영업손실을 냈습니다 [39]. 나중에 실제 원가가 가정보다 덜 들면 충당금이 환입돼 이익이 일시적으로 커집니다.",
       "둘째, 인도가 늦어질 때 내는 지체상금(예: 하루 20만 달러)이나 조기 인도 보너스 같은 <b>변동대가</b>는 나중에 되돌려질 가능성이 매우 낮은 만큼만 매출에 넣습니다 [37]. 셋째, 직전 연도 매출의 <b>5% 이상인 계약</b>은 진행률과 계약자산·손실충당금 등을 계약별로 공시해야 하므로, 사업보고서에서 큰 계약의 진척을 직접 확인할 수 있습니다 [37].",
       "정리하면 조선사의 분기 이익은 '이번 분기에 한 일'뿐 아니라 '남은 공사의 원가 추정 변화'까지 담습니다. 이익이 갑자기 튀거나 꺼진 분기는 충당금 설정이나 환입이 있었는지부터 확인하는 것이 좋습니다."]},
    {id:"p4",h:"1-4 원가와 환율: 마진을 흔드는 두 변수",
     paras:["원가에서 가장 큰 단일 항목은 <b>후판(두꺼운 철판)</b>으로, 선체 건조 원가의 약 20%를 차지하며 조선사가 포스코·현대제철과 가격을 협상합니다 [37]. 엔진·화물창 등 기자재와 인건비도 주요 원가입니다. 조선업은 노동집약적이라 사람이 중요하고, 2024년 말 대형 3사와 협력사에서 일하는 외국인 근로자는 약 1만2천명이었습니다 [37]. 후판 가격은 2026년 톤당 620달러(+4.3%), 2027년 +6.8%로 완만하게 오를 것으로 추정됩니다 [6].",
       "배값은 대부분 달러로 받고 원가는 상당 부분 원화로 나가기 때문에, 계약부터 인도까지 2~3년 동안 환율 위험에 노출됩니다 [37]. 원/달러 환율이 오르면(원화 약세) 원화로 환산한 매출과 이익이 늘고, 내리면 줄어듭니다. 그래서 조선사는 앞으로 받을 달러를 미리 파는 방식으로 환헤지를 합니다. HD현대중공업의 헤지 비율은 70~75%로 추정되고, 한화오션은 70% 이상을 목표로 합니다 [42].",
       "헤지를 하면 영업이익은 덜 흔들리지만, 헤지 상품의 평가손익이 영업외손익으로 잡혀 순이익이 영업이익과 크게 달라질 수 있습니다. 2026년 3분기(평균 환율 약 1,418원, 2분기 1,502원)가 좋은 예입니다. 삼성중공업은 달러를 거의 전부 헤지한 덕에 환헤지 이익이 생겨 순이익이 4,708억원(+235.6%)으로 영업이익(3,384억원)보다 컸습니다. 반면 한화오션은 영업이익 4,857억원에도 영업외손실 3,740억원으로 순이익이 1,451억원(−46.1%)에 그쳤고, HD한국조선해양은 외환 관련 손실 6,102억원으로 순이익이 7,770억원(−11.4%)이었습니다 [42]. 5장에서 쓰는 ROE(순이익 기준)가 분기마다 출렁이는 이유입니다."]}
  ],

  policy:{
    intro:"2025년 이후 조선주는 실적만큼이나 정책 뉴스에 크게 반응했습니다. 4장의 날짜별 이벤트 상당수가 아래 정책과 연결돼 있으니, 먼저 큰 그림을 잡고 넘어가는 것이 좋습니다.",
    cols:["정책","언제","무슨 내용인가","규모","조선주에 닿는 경로","주가 반응 (3사 평균 − 코스피)","지금 상태"],
    rows:[
      ["미국 '해양 지배력 회복' 행정명령","2025년 4월","미국 조선업 재건과 중국 해운·조선 견제를 내건 대통령 행정명령 [50]","금액 없음 (정책 방향 제시)","미국이 조선 능력을 키우려면 한국 조선소와 협력해야 한다는 기대. 국내 언론은 한국 조선의 반사이익을 전망 [50]","발표 주(4/7~11) +11.9%p, 4주 +15.0%p (주간 종가, 일별 자료 없음)","이후 MASGA 합의와 USTR 조치로 구체화"],
      ["USTR 301조 입항 수수료","2025년 10월 14일 발효","중국이 운영·소유한 선박은 순톤당 50달러(2028년 140달러까지 인상), 중국에서 지은 선박은 순톤당 18달러(2028년 33달러) 또는 컨테이너당 120달러(2028년 250달러) [43]","수수료 단가는 왼쪽. 미국이 걷게 될 연간 총액은 확인 못함","선주가 중국산 배를 피할 이유가 생겨 한국 수주에 우호적","당일 −4.2%p, 5거래일 −4.9%p, 20거래일 +1.1%p (중국 보복과 같은 날이라 둘이 섞여 있음)","2025년 10월 30일 미·중 정상회담 뒤 2025년 11월 10일부터 2026년 11월 9일까지 1년 유예 [43]. 유예 종료 이후 상태는 이 리포트가 확인하지 못함"],
      ["중국의 보복 조치","2025년 10월 14일","미국 관련 선박에 순톤당 400위안 입항료(2028년 1,120위안까지). 한화오션 미국 자회사 5곳(한화필리조선소 등)과의 모든 거래·협력 금지 [43][45]","한화오션 미국 자회사 5곳 거래 금지","한화오션의 미국 사업에 중국 리스크가 붙음. 발표일 3사 주가 −4~−6%","위와 같은 날. 당일 한화오션 −5.8%, HD현대중공업 −4.1%, 삼성중공업 −4.7% (코스피 −0.6%)","입항료는 미·중 유예 합의 대상. 한화 자회사 제재의 해제 여부는 확인한 기사에 없음 [43]"],
      ["MASGA (한미 조선 협력)","2025년 7월 31일 합의, 10월 29일 구체화","3,500억 달러 대미 투자 가운데 1,500억 달러를 조선 협력에 배정. 현금이 아니라 정부 보증·선박금융 중심이고, 별도의 현금 2,000억 달러는 연 200억 달러 한도 [44]","1,500억 달러 (대미 투자 3,500억 달러 중) [44]","미국 신규 조선소, 인력 양성, 공급망 재건, MRO 등 한국 조선사 수요에 기반한 프로젝트 [44]","7/31 합의: 당일 +6.3%p(한화오션 +13.4%), 5거래일 +7.7%p, 20거래일 +12.0%p. 10/30 정상회담(세부 타결·핵잠 승인): 당일 +2.4%p, 5거래일 −6.1%p, 20거래일 −9.1%p","2026년 6월 수출입은행 등 금융기관과 3사가 '한미 조선협력투자 협의체' MOU 체결 [44]"],
      ["미 의회의 해외 건조 제한","2026년 6월 9일","미 하원 군사위원회가 해외 조선소의 미 해군 함정 건조를 막는 국방수권법(NDAA) 조항을 통과 [22]","금액 확인 못함. 참고로 미 해군 LSM 계획 35척, 첫 수주 2.69억 달러 [4]","미 함정 '건조' 기회가 줄 수 있다는 우려(정비·MRO는 별개)","당일 −9.3%p(코스피 +8.2%인 날 3사 −1.1%), 다음 날 +8.9%p, 20거래일 −8.5%p","최종 법안 반영 여부는 이 리포트가 확인하지 못함"],
      ["IMO 넷제로 프레임워크","2025년 4월 승인, 10월 17일 채택 1년 연기","5,000GT 이상 선박에 연료 온실가스 집약도 기준을 두고, 못 맞추면 비용을 내는 제도. 2027년 발효가 목표였으나 표결(57 대 49)로 채택이 1년 미뤄짐 [46]","5,000GT 이상 선박. 운항 선박의 약 35%(약 5만 척)가 기준을 못 맞출 노후선으로 추정 [59]","LNG·암모니아·메탄올 추진선 같은 친환경 선박 교체 수요의 시기를 좌우","연기 뒤 첫 거래일(10/20) +0.5%p로 거의 반응 없음. 5거래일 +12.5%p는 같은 주 다른 뉴스와 섞여 있어 IMO 효과로 보기 어려움","연기로 친환경 연료·추진 투자에 '확실성 공백'이 생겼다는 평가 [46]"]],

      d1:[11.9,6.3,-4.2,0.5,2.4,-9.3],d5:[null,7.7,-4.9,12.5,-6.1,0.6],d20:[15.0,12.0,1.1,10.4,-9.1,-8.5],
      t1:["발표 주 +11.9%p (3사 +10.6%, 코스피 −1.3%)","+6.3%p (3사 +6.0%, 코스피 −0.3%)","−4.2%p (3사 −4.8%, 코스피 −0.6%)","+0.5%p (3사 +2.3%, 코스피 +1.8%)","+2.4%p (3사 +2.6%, 코스피 +0.1%)","−9.3%p (3사 −1.1%, 코스피 +8.2%)"],
      t5:["주간 자료라 없음","+7.7%p (3사 +5.9%, 코스피 −1.7%)","−4.9%p (3사 +1.5%, 코스피 +6.4%)","+12.5%p (3사 +17.6%, 코스피 +5.1%)","−6.1%p (3사 −8.0%, 코스피 −1.9%)","+0.6%p (3사 +14.8%, 코스피 +14.2%)"],
      t20:["4주 +15.0%p (3사 +18.8%, 코스피 +3.8%)","+12.0%p (3사 +10.2%, 코스피 −1.8%)","+1.1%p (3사 +14.7%, 코스피 +13.6%)","+10.4%p (3사 +17.4%, 코스피 +7.0%)","−9.1%p (3사 −12.0%, 코스피 −2.9%)","−8.5%p (3사 −0.9%, 코스피 +7.6%)"]},
    impactNote:"주가 반응 = 3사(HD현대중공업·한화오션·삼성중공업) 단순 평균 등락률 − 코스피 등락률. 당일은 전 거래일 종가 대비, 5·20거래일은 발표 전 거래일 종가부터 누적. IMO는 런던 표결이 한국 시간 금요일 밤이라 다음 거래일(월요일)을 당일로 봤습니다. 행정명령은 일별 자료가 없는 2025년 4월이라 주간 종가(4/4 → 4/11, 4/4 → 5/2)입니다. 같은 기간 다른 뉴스의 영향이 섞여 있습니다 [12][52].",
    impactPs:["<b>정책의 금액보다 '한국 조선소가 직접 일감을 받는 경로가 분명한가'가 주가 반응을 갈랐습니다.</b> 일별 자료로 잴 수 있는 정책 중 가장 크고 오래간 것은 MASGA(1,500억 달러)였습니다. 합의 당일 3사가 코스피보다 6.3%p, 20거래일 뒤에도 12.0%p 더 올랐습니다. 금액이 명시되고 한국 조선사를 직접 지목했기 때문으로 보입니다. 금액이 없는 행정명령도 발표 주에 11.9%p, 4주 동안 15.0%p 초과 상승했는데, '미국이 한국 조선소를 필요로 한다'는 첫 신호였기 때문입니다.",
        "반대로 간접 효과이거나 이미 기대가 높던 정책은 오래가지 않았습니다. USTR 입항 수수료는 같은 날 나온 중국의 한화오션 제재와 겹쳐 당일 −4.2%p였지만 20거래일 뒤에는 +1.1%p로 돌아왔습니다. 한미 정상회담(10/30)은 당일 +2.4%p 뒤 20거래일 −9.1%p로, 기대를 먼저 반영한 뒤 발표 후 차익을 실현하는 흐름이었습니다. 미 의회의 해외 건조 제한(2026년 6월 9일)은 코스피가 8.2% 오른 날 3사가 1.1% 내려 −9.3%p였고, 다음 날 되돌렸지만 20거래일 뒤에는 −8.5%p였습니다.",
        "IMO 넷제로 연기는 첫 거래일 +0.5%p로 거의 영향이 없었습니다. 2028년까지 일감이 차 있어 당장의 수주와 이익을 바꾸지 않는 장기 변수이기 때문입니다. 정리하면 정책 뉴스의 당일(행정명령은 발표 주) 반응은 −9.3~+11.9%p로 컸지만, 20거래일 뒤까지 크게 남은 것은 '한국 조선소가 수혜자'라는 점이 분명했던 행정명령(+15.0%p, 4주)과 금액까지 정해진 MASGA(+12.0%p)였습니다. IMO 연기 뒤 20거래일 +10.4%p도 남았지만, 앞에서 본 것처럼 같은 시기 다른 뉴스와 섞여 있어 IMO 효과로 보기는 어렵습니다."],
    imo:{h:"검토: 12월 IMO '노후선 규제' 표결은 중요한가",
      ps:["말씀하신 규제는 IMO의 넷제로 프레임워크(NZF)로 보입니다. 노후선을 직접 금지하는 규정이 아니라, 5,000GT 이상 선박에 연료의 온실가스 집약도 기준을 두고 못 맞추면 비용을 내게 하는 제도입니다 [46]. 2025년 10월 17일 특별회기에서 채택 표결이 57 대 49로 1년 미뤄졌고 [46], 2026년 4월 27일~5월 1일 MEPC 84에서도 결론 없이 다음 회의로 넘어갔습니다 [59]. 기후단체는 '올해 안' 채택을 목표로 연말 IMO 회의를 언급했지만 [59], <b>12월 표결 날짜는 IMO 발표나 기사로 확인하지 못했습니다.</b> 10월 말 국내 행사에서는 조선업계에서 '규제의 불확실성이 오히려 커지는' 상황이라는 말이 나왔습니다 [60].",
        "채택되면 교체 수요의 근거가 됩니다. 세계 운항 선박의 약 35%(약 5만 척)가 IMO 탄소 규제를 맞추지 못할 노후선으로 추정되고, 발주잔량 톤수의 74%가 이미 대체연료 추진선입니다 [59]. 이 교체 수요는 도크가 찬 2028년 이후의 일감, 즉 5장의 ω(초과이익 지속계수)와 직결됩니다.",
        "그러나 지난 반응은 작았습니다. 2025년 10월 연기 뒤 첫 거래일(10/20) 3사 평균은 +2.3%로 코스피(+1.8%)보다 0.5%p 더 올랐을 뿐입니다 [12]. <b>이 리포트의 판단: 중요도는 '중간'입니다.</b> 표결 당일의 주가 변수로는 작지만, 채택 여부는 2029년 이후 발주를 가늠하는 신호라 6장 일정과 체크리스트에 넣었습니다. 채택되면 ω 강세(0.8) 쪽 근거가, 또 미뤄지면 기본·약세 쪽 근거가 됩니다."]},
    outro:"투자자 관점에서 미국 정책은 '한국 조선소를 써야 하는 이유'를 늘리는 방향이었습니다. 하지만 실제 계약(예: 2026년 11월 한화 필리조선소의 미 해군 상륙함 첫 수주 2.69억 달러 [4])으로 이어지는 속도는 기대보다 느렸고, 중국의 보복과 미 의회의 해외 건조 제한처럼 반대 방향의 변수도 함께 커졌습니다. 4장의 주가 흐름은 이 기대와 실망이 번갈아 반영된 결과입니다."
  },

  profiles:[
    {n:"HD현대중공업",code:"329180",ps:["HD현대 그룹 조선 부문의 중간지주사인 HD한국조선해양의 자회사입니다 [48]. 2025년 8월 27일 HD현대미포를 흡수합병하기로 결의했고(미포 1주당 HD현대중공업 0.4059146주), 2025년 12월 통합 출범을 계획했습니다 [47].","HD 조선 계열사 가운데 유일하게 군함 건조 면허를 갖고 있고, 2035년 방산 매출 연 10조원을 목표로 합니다 [47]. HD한국조선해양 기준 2026년 수주는 8월 말까지 187.1억 달러로 이미 2025년 연간(185.5억 달러)을 넘었습니다 [48]."]},
    {n:"한화오션",code:"042660",ps:["옛 대우조선해양으로, 한화그룹이 인수해 2023년 5월 한화오션으로 출범했습니다 [50]. 2024년 12월 미국 필리조선소를 인수했고, 2026년 11월 필리조선소가 미 해군 상륙함(LSM) 첫 계약을 따냈습니다 [1][4].","2025년 10월 중국이 미국 자회사 5곳을 제재했고 [45], 2026년 7월에는 캐나다 잠수함 사업(약 60조원) 우선협상대상자에서 탈락했습니다 [22]. 2025년 수주는 51척, 98.3억 달러였습니다 [48]."]},
    {n:"삼성중공업",code:"010140",ps:["LNG선 등 고부가 상선이 중심이고 군함 건조 면허는 없습니다. 2026년 수주는 10월 말 48척, 124억 달러로 연간 목표(139억 달러)의 89%입니다 [42].","미국 GD NASSCO와 차세대 군수지원함 협력을 추진하며 함정 정비 협약(MSRA) 자격 확보를 목표로 합니다 [4]. 달러를 거의 전부 헤지해 3분기 순이익(4,708억원)이 영업이익보다 컸습니다 [42]."]},
    {n:"HD한국조선해양",code:"009540",ps:["HD현대중공업·HD현대삼호 등을 거느린 조선 부문 중간지주입니다 [48]. 자회사 이익이 연결로 겹쳐 잡히므로 HD현대중공업과 함께 사면 같은 이익을 두 번 사는 셈이 됩니다.","이 리포트의 '3사 실적'에서 HD 측 숫자는 대부분 HD한국조선해양 연결 기준이고, 주가 비교는 HD현대중공업 기준입니다. 2026년 예상 배당수익률은 7.3%(11/5 주가 기준)입니다 [6]."]}

function evList(D){return D.events.map((e,n)=>{const i=PX.d.indexOf(e.d);const R=PXR;return {...e,i,n:n+1,hd:R.hd[i],hw:R.hw[i],sh:R.sh[i],ks:R.ks[i],avg:R.avg[i],gap:R.gap[i],up:R.gap[i]>=0}})}
function bigList(D){return D.bigEvents.map(e=>{const i=PXM.d.indexOf(e.m);const mr=k=>i>0&&PXM[k][i-1]!=null&&PXM[k][i]!=null?(PXM[k][i]/PXM[k][i-1]-1)*100:null;
  const hd=mr("hd"),hw=mr("hw"),sh=mr("sh"),ks=mr("ks");const avg=[hd,hw,sh].every(v=>v!=null)?(hd+hw+sh)/3:null;return {...e,i,hd,hw,sh,ks,avg,gap:avg!=null&&ks!=null?avg-ks:null}})}
function bindChecklist(D){
  const key="chk-"+D.name; let st={};
  try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  const boxes=[...document.querySelectorAll('.chk input')];
  const p=document.getElementById("chk-p");
  const upd=()=>{const n=boxes.filter(b=>b.checked).length;p.textContent=`${n} / ${boxes.length} 확인`;const b=document.getElementById("chk-bar");if(b)b.style.width=(n/boxes.length*100)+"%"};
  boxes.forEach((b,i)=>{b.checked=!!st[i];b.addEventListener("change",()=>{st[i]=b.checked;try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}upd()})});
  upd();
}

    events:EVL.map(e=>({i:e.i,n:e.n,up:e.up,tip:`${e.n}. ${e.d} ${e.t} · 차이 ${pm1(e.gap,"%p")}`}))}));
  K.hbars(document.getElementById("ch-orders"),{data:G.orders,max:150,ref:{value:100,label:"연간 목표 100%"}});
  K.mount(document.getElementById("ch-plate"),K.line({labels:G.plate.labels,series:[{color:"var(--sea)",points:G.plate.values.map(y=>({y}))}],unit:"$/톤",yMin:G.plate.yMin,labelAll:true,dec:0}));

    points:D.risks.map((r,i)=>({x:r.p,y:r.i,num:i+1,r:11,color:r.lvl==="bad"?"var(--hull)":"var(--warn)",showLabel:false,tip:`${i+1}. ${r.t} · 가능성 ${r.p} · 영향 ${r.i}`}))}));
